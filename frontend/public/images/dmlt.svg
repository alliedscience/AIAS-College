<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bgLab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1e36"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="520" fill="url(#bgLab)"/>
  <rect width="800" height="520" fill="url(#grid)"/>

  <!-- Lab Bench Counter -->
  <rect x="0" y="420" width="800" height="100" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="416" width="800" height="6" fill="#38bdf8" opacity="0.6"/>

  <!-- Diagnostic Monitor / Hematology Screen -->
  <rect x="420" y="80" width="330" height="230" rx="6" fill="#09131f" stroke="#0284c7" stroke-width="2.5"/>
  <rect x="430" y="90" width="310" height="175" rx="3" fill="#020813"/>
  <!-- UI Header on monitor -->
  <rect x="430" y="90" width="310" height="26" fill="#0c233c"/>
  <circle cx="445" cy="103" r="4" fill="#ef4444"/>
  <circle cx="457" cy="103" r="4" fill="#f59e0b"/>
  <circle cx="469" cy="103" r="4" fill="#10b981"/>
  <text x="485" y="107" font-size="10" font-family="monospace" fill="#38bdf8" font-weight="bold">AIAS CLINICAL LAB ANALYZER v4.2</text>
  <!-- Spectrum / ECG / Blood cell count graph -->
  <path d="M 445 190 L 490 190 L 510 130 L 530 220 L 550 160 L 580 190 L 630 190 L 650 145 L 670 190 L 725 190" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 445 235 L 500 235 L 520 205 L 540 250 L 560 215 L 590 235 L 725 235" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <!-- Digital Telemetry Text -->
  <rect x="445" y="120" width="85" height="30" rx="3" fill="#0e2942" stroke="#0284c7" stroke-width="1"/>
  <text x="452" y="132" font-size="8" font-family="monospace" fill="#94a3b8">WBC COUNT</text>
  <text x="452" y="145" font-size="12" font-family="monospace" fill="#38bdf8" font-weight="bold">7,850 /mcL</text>
  
  <rect x="545" y="120" width="85" height="30" rx="3" fill="#0e2942" stroke="#0284c7" stroke-width="1"/>
  <text x="552" y="132" font-size="8" font-family="monospace" fill="#94a3b8">HEMOGLOBIN</text>
  <text x="552" y="145" font-size="12" font-family="monospace" fill="#38bdf8" font-weight="bold">14.6 g/dL</text>

  <rect x="645" y="120" width="85" height="30" rx="3" fill="#0e2942" stroke="#0284c7" stroke-width="1"/>
  <text x="652" y="132" font-size="8" font-family="monospace" fill="#94a3b8">PLATELETS</text>
  <text x="652" y="145" font-size="12" font-family="monospace" fill="#10b981" font-weight="bold">285,000</text>
  <!-- Monitor Stand -->
  <rect x="565" y="310" width="40" height="60" fill="#334155"/>
  <rect x="525" y="370" width="120" height="15" rx="3" fill="#1e293b" stroke="#475569" stroke-width="2"/>

  <!-- Advanced Binocular Clinical Microscope -->
  <g transform="translate(140, 110)">
    <!-- Base -->
    <path d="M 40 300 C 40 280 60 270 110 270 C 160 270 180 280 180 300 Z" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <rect x="60" y="295" width="100" height="12" rx="2" fill="#334155"/>
    <circle cx="110" cy="275" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <!-- Pillar / Arm -->
    <path d="M 140 270 C 170 230 190 170 170 100 C 160 65 130 55 90 55 L 75 55" fill="none" stroke="#1e293b" stroke-width="28" stroke-linecap="round"/>
    <path d="M 140 270 C 170 230 190 170 170 100 C 160 65 130 55 90 55 L 75 55" fill="none" stroke="#475569" stroke-width="22" stroke-linecap="round"/>
    <circle cx="155" cy="190" r="12" fill="#0284c7" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="155" cy="190" r="6" fill="#0f172a"/>
    <!-- Stage -->
    <rect x="30" y="180" width="110" height="14" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <!-- Glass Slide -->
    <rect x="60" y="174" width="50" height="6" rx="1" fill="#bae6fd" opacity="0.8"/>
    <circle cx="85" cy="177" r="3" fill="#ef4444"/>
    <!-- Objectives Revolver -->
    <path d="M 70 115 L 100 115 L 95 135 L 75 135 Z" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="80" y="135" width="10" height="25" fill="#c59b27" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="67" y="135" width="9" height="20" fill="#0284c7"/>
    <!-- Head & Eyepieces -->
    <polygon points="65,55 105,55 95,95 75,95" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <line x1="75" y1="55" x2="60" y2="15" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
    <line x1="95" y1="55" x2="110" y2="15" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
    <rect x="52" y="8" width="16" height="12" rx="2" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <rect x="102" y="8" width="16" height="12" rx="2" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
  </g>

  <!-- Test Tube Rack with Colored Specimens -->
  <g transform="translate(360, 310)">
    <!-- Rack -->
    <rect x="0" y="70" width="140" height="15" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="30" width="140" height="10" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <rect x="10" y="30" width="8" height="70" fill="#1e293b"/>
    <rect x="122" y="30" width="8" height="70" fill="#1e293b"/>
    <!-- Tube 1 (Blood / Hematology) -->
    <rect x="25" y="10" width="16" height="70" rx="8" fill="#e2e8f0" fill-opacity="0.25" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 26 40 Q 33 43 40 40 L 40 72 A 7 7 0 0 1 26 72 Z" fill="#b91c1c"/>
    <rect x="24" y="8" width="18" height="7" rx="2" fill="#991b1b"/>
    <!-- Tube 2 (Serum / Biochemistry) -->
    <rect x="50" y="15" width="16" height="65" rx="8" fill="#e2e8f0" fill-opacity="0.25" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 51 45 Q 58 48 65 45 L 65 72 A 7 7 0 0 1 51 72 Z" fill="#eab308"/>
    <rect x="49" y="13" width="18" height="7" rx="2" fill="#ca8a04"/>
    <!-- Tube 3 (Culture / Microbiology) -->
    <rect x="75" y="5" width="16" height="75" rx="8" fill="#e2e8f0" fill-opacity="0.25" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 76 35 Q 83 38 90 35 L 90 72 A 7 7 0 0 1 76 72 Z" fill="#06b6d4"/>
    <rect x="74" y="3" width="18" height="7" rx="2" fill="#0891b2"/>
    <!-- Tube 4 (Urine / Pathology) -->
    <rect x="100" y="20" width="16" height="60" rx="8" fill="#e2e8f0" fill-opacity="0.25" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 101 50 Q 108 53 115 50 L 115 72 A 7 7 0 0 1 101 72 Z" fill="#84cc16"/>
    <rect x="99" y="18" width="18" height="7" rx="2" fill="#65a30d"/>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="24" y="24" width="280" height="52" rx="4" fill="#0c1f38" stroke="#0284c7" stroke-width="1.5"/>
  <text x="38" y="44" font-size="12" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="bold" fill="#38bdf8" letter-spacing="1">PARAMEDICAL SCIENCES</text>
  <text x="38" y="63" font-size="14" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" fill="#ffffff">DMLT • 2 YEARS DIPLOMA</text>
</svg>