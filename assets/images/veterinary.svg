<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bgVet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="60%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bgVet)"/>

  <!-- Clinical Examination Room Wall & Counters -->
  <rect x="0" y="400" width="800" height="120" fill="#132338" stroke="#334e68" stroke-width="2"/>
  <rect x="0" y="396" width="800" height="5" fill="#38bdf8" opacity="0.7"/>

  <!-- Veterinary Monitor / Vital Signs -->
  <rect x="60" y="90" width="280" height="190" rx="8" fill="#0b1b2b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="70" y="100" width="260" height="145" rx="4" fill="#040c14"/>
  <rect x="70" y="100" width="260" height="22" fill="#102a45"/>
  <circle cx="82" cy="111" r="3.5" fill="#10b981"/>
  <text x="94" y="115" font-size="9" font-family="monospace" fill="#38bdf8" font-weight="bold">ANIMAL VITALS • MONITORING SYSTEM</text>
  <!-- ECG / Pulse Line -->
  <path d="M 80 180 L 120 180 L 130 145 L 140 205 L 150 170 L 165 180 L 220 180 L 230 150 L 240 195 L 250 180 L 310 180" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <text x="82" y="145" font-size="11" font-family="monospace" fill="#94a3b8">HEART RATE: <tspan fill="#4ade80" font-weight="bold">98 BPM</tspan></text>
  <text x="82" y="225" font-size="9" font-family="monospace" fill="#93c5fd">TEMP: 101.5°F | SPO2: 99%</text>

  <!-- Central Animal Care Station: Vet Stethoscope, Puppy & Kitten Silhouette Art -->
  <g transform="translate(420, 130)">
    <!-- Examination Table Surface -->
    <rect x="-40" y="270" width="400" height="18" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <rect x="100" y="288" width="80" height="110" fill="#475569"/>

    <!-- Gentle Puppy Figure (Golden Retriever puppy) -->
    <path d="M 40 270 C 35 220 60 170 95 160 C 110 155 130 160 140 180 C 150 170 170 170 180 185 C 190 200 200 240 195 270 Z" fill="#d97706"/>
    <!-- Puppy Ears -->
    <path d="M 80 165 C 60 170 50 195 65 210 C 75 200 80 180 80 165 Z" fill="#b45309"/>
    <path d="M 135 165 C 155 170 165 195 150 210 C 140 200 135 180 135 165 Z" fill="#b45309"/>
    <!-- Puppy Muzzle -->
    <circle cx="108" cy="205" r="14" fill="#fef3c7"/>
    <ellipse cx="108" cy="198" rx="5" ry="3.5" fill="#1e293b"/>
    <circle cx="95" cy="185" r="3.5" fill="#1e293b"/>
    <circle cx="120" cy="185" r="3.5" fill="#1e293b"/>

    <!-- Cute Kitten Figure sitting beside -->
    <path d="M 210 270 C 205 235 220 200 245 195 C 255 190 270 195 275 210 C 285 225 290 250 285 270 Z" fill="#f97316"/>
    <!-- Kitten Pointy Ears -->
    <polygon points="230,195 240,170 250,195" fill="#ea580c"/>
    <polygon points="265,195 275,170 285,195" fill="#ea580c"/>
    <polygon points="234,192 240,175 246,192" fill="#ffedd5"/>
    <polygon points="269,192 275,175 281,192" fill="#ffedd5"/>
    <circle cx="248" cy="210" r="3" fill="#1e293b"/>
    <circle cx="268" cy="210" r="3" fill="#1e293b"/>
    <ellipse cx="258" cy="218" rx="3" ry="2" fill="#fda4af"/>
    <!-- Whisker lines -->
    <line x1="240" y1="218" x2="225" y2="216" stroke="#fed7aa" stroke-width="1"/>
    <line x1="240" y1="222" x2="225" y2="224" stroke="#fed7aa" stroke-width="1"/>
    <line x1="275" y1="218" x2="290" y2="216" stroke="#fed7aa" stroke-width="1"/>
    <line x1="275" y1="222" x2="290" y2="224" stroke="#fed7aa" stroke-width="1"/>

    <!-- Medical Stethoscope Drape -->
    <path d="M 10 230 C 20 275 60 295 100 295 C 160 295 220 285 280 270" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <circle cx="10" cy="230" r="10" fill="#94a3b8" stroke="#f1f5f9" stroke-width="2"/>
    <circle cx="10" cy="230" r="5" fill="#0284c7"/>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="24" y="24" width="310" height="52" rx="4" fill="#091b2c" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="38" y="44" font-size="12" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="bold" fill="#38bdf8" letter-spacing="1">VETERINARY &amp; ANIMAL HEALTH</text>
  <text x="38" y="63" font-size="14" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" fill="#ffffff">VETERINARY ASSISTANT • 2 YEARS</text>
</svg>