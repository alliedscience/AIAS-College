services:
  - type: web
    name: aias-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        value: admin@aias.edu.in
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
